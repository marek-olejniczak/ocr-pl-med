# Containers run as the host user (HUID/HGID) so everything they write into the
# bind-mounted /benchmark (checkpoints, predictions, results) is owned by you,
# not root. Set HUID/HGID once in a local .env file (gitignored), e.g.:
#   printf 'HUID=%s\nHGID=%s\n' "$(id -u)" "$(id -g)" > .env
# HOME and the cache/tmp dirs point into the bind mount, not /tmp: a non-root
# user cannot write /root, and /tmp lives on the container layer, which on a
# host with a full root filesystem means ENOSPC in the middle of a run.
# torch, ultralytics and matplotlib each pick their own variable.
# USER/LOGNAME because getpass.getuser() reads them before /etc/passwd, which
# has no entry for the host uid we run as - torch._inductor calls it and dies.
services:
  ultralytics:
    build: ./docker/ultralytics
    user: "${HUID:-1000}:${HGID:-1000}"
    # Docker's default /dev/shm is 64MB; PyTorch DataLoader workers share
    # tensors through it and overflow → "No space left on device". 8GB is
    # plenty for batch 64 with 8 workers.
    shm_size: "8gb"
    volumes:
      - .:/benchmark
      # NOTE: symlinks under dataset/yolo_*/images point at host paths - they
      # must be visible in the container at the SAME path, e.g.:
      # - /home/user/datasets/lines:/home/user/datasets/lines:ro
      # or generate the layout with to_yolo --copy
    working_dir: /benchmark
    environment:
      - WANDB_API_KEY
      - HOME=/benchmark/results/.home
      - TMPDIR=/benchmark/results/.home/tmp
      - YOLO_CONFIG_DIR=/benchmark/results/.home/Ultralytics
      - MPLCONFIGDIR=/benchmark/results/.home/matplotlib
      - TORCHINDUCTOR_CACHE_DIR=/benchmark/results/.home/torchinductor
      - USER=benchmark
      - LOGNAME=benchmark
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  detectron2:
    build: ./docker/detectron2
    user: "${HUID:-1000}:${HGID:-1000}"
    shm_size: "8gb"
    volumes:
      - .:/benchmark
    working_dir: /benchmark
    environment:
      - WANDB_API_KEY
      - HOME=/benchmark/results/.home
      - TMPDIR=/benchmark/results/.home/tmp
      - YOLO_CONFIG_DIR=/benchmark/results/.home/Ultralytics
      - MPLCONFIGDIR=/benchmark/results/.home/matplotlib
      - TORCHINDUCTOR_CACHE_DIR=/benchmark/results/.home/torchinductor
      - USER=benchmark
      - LOGNAME=benchmark
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  surya:
    build: ./docker/surya
    user: "${HUID:-1000}:${HGID:-1000}"
    shm_size: "8gb"
    volumes:
      - .:/benchmark
    working_dir: /benchmark
    environment:
      - WANDB_API_KEY
      - HOME=/benchmark/results/.home
      - TMPDIR=/benchmark/results/.home/tmp
      - YOLO_CONFIG_DIR=/benchmark/results/.home/Ultralytics
      - MPLCONFIGDIR=/benchmark/results/.home/matplotlib
      - TORCHINDUCTOR_CACHE_DIR=/benchmark/results/.home/torchinductor
      - USER=benchmark
      - LOGNAME=benchmark
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  kraken:
    build: ./docker/kraken
    user: "${HUID:-1000}:${HGID:-1000}"
    shm_size: "8gb"
    volumes:
      - .:/benchmark
    working_dir: /benchmark
    environment:
      - WANDB_API_KEY
      - HOME=/benchmark/results/.home
      - TMPDIR=/benchmark/results/.home/tmp
      - YOLO_CONFIG_DIR=/benchmark/results/.home/Ultralytics
      - MPLCONFIGDIR=/benchmark/results/.home/matplotlib
      - TORCHINDUCTOR_CACHE_DIR=/benchmark/results/.home/torchinductor
      - USER=benchmark
      - LOGNAME=benchmark
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
