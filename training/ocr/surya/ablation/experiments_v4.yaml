# Wygenerowane przez text-gen (generator v4, 2026-11). Uruchomienie:
#   cd benchmark && python autorunner.py --config ../training/ocr/surya/ablation/experiments_v4.yaml
# Testset: dataset/test/real/v1.2 (2972 linie), rozpakowany przez prepare_real_v12.sh.
experiment:
  name: ocr-v4
  project_name: ocr-benchmark
  wandb_entity: ocr-pl-med
  tags:
  - autorun
  - http
  - sequential
  - server
  - v4
  hardware_note: Nvidia RTX 3090, 24GB VRAM
settings:
  output_dir: wyniki
  export_overleaf_table: false
  auto_start_services: true
  stop_service_after_run: true
  sequential: true
  warmup_samples: 1
  cooldown_seconds: 5
  restart_docker_per_dataset: false
  http_timeout_default: 120
  wandb_log: false
datasets:
- id: real_v12
  enabled: true
  labels_csv: dane/real_v1.2/labels.csv
  images_dir: dane/real_v1.2/images
  limit: null
  single_words: false
models:
- id: surya
  service_name: surya
  base_url: http://localhost:8008
  enabled: true
  timeout: 600
  options:
    device: cuda
    batch_size: 8
    task_name: ocr_without_boxes
    disable_math: false
    cache_dir: modele/cache/surya
- id: surya_lora_ocr800k
